name: Validate Portable Skills

on:
  push:
    paths:
      - ".agents/**"
      - "templates/**"
      - "references/**"
      - "scripts/**"
      - "workflows/validate.yml"
  pull_request:
    paths:
      - ".agents/**"
      - "templates/**"
      - "references/**"
      - "scripts/**"
      - "workflows/validate.yml"

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate portable templates
        run: python scripts/validate-skills.py templates --allow-placeholders
      - name: Check template health
        run: python scripts/check-skill-health.py templates --allow-placeholders
