name: Check Guide Tooling

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "SKILL.md"
      - ".gitignore"
      - "docs/**"
      - "references/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "SKILL.md"
      - ".gitignore"
      - "docs/**"
      - "references/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run utility regression tests
        run: python -m unittest discover -s tests -v
      - name: Check local Markdown links
        run: python scripts/check-markdown-links.py .
